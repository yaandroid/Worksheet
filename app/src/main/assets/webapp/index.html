<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BRAHM Office</title>
<link rel="stylesheet" href="styles.css">
<style>
  .pdfview{position:absolute;inset:0;display:none;overflow:auto;background:#444;-webkit-overflow-scrolling:touch}
  .pdfview canvas{display:block;margin:8px auto;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.4);max-width:100%}
  .textview{position:absolute;inset:0;display:none;overflow:auto;background:var(--bg);color:var(--txt);padding:14px;white-space:pre-wrap;font-size:14px;line-height:1.6}
  .htmlview{position:absolute;inset:0;display:none;border:0;width:100%;height:100%;background:#fff}
  .zoombar{display:none;align-items:center;gap:6px}
  .zoombar.show{display:flex}
  .loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--muted);font-size:15px;background:var(--bg)}
  .loading.show{display:flex}
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="logo"></span> BRAHM Office</div>
    <button class="btn" id="btnOpen">Open</button>
    <button class="btn" id="btnNew">New sheet</button>
    <button class="btn accent" id="btnSaveXlsx">Save .xlsx</button>
    <button class="btn" id="btnSaveCsv">.csv</button>
    <button class="btn" id="btnImages" style="display:none">Images</button>
    <div class="zoombar" id="zoombar">
      <button class="btn" id="zoomOut">−</button>
      <button class="btn" id="zoomIn">+</button>
    </div>
    <div class="spacer"></div>
  </div>

  <div class="formulabar" id="fbar">
    <div class="cellref" id="cellref">A1</div>
    <input id="finput" placeholder="Value or =formula" spellcheck="false" autocomplete="off">
  </div>

  <div class="stage">
    <canvas id="grid"></canvas>
    <div class="pdfview" id="pdfview"></div>
    <div class="textview" id="textview"></div>
    <iframe class="htmlview" id="htmlview"></iframe>
    <div class="loading" id="loading">Opening…</div>
    <div class="gallery" id="gallery"></div>
    <div class="lightbox" id="lightbox"><img id="lightimg" src=""></div>
  </div>

  <div class="statusbar">
    <div class="sheettabs" id="tabs"></div>
    <div id="status">BRAHM Office · Developed by Sandeep Kushwah</div>
  </div>

  <script src="vendor/xlsx.full.min.js"></script>
  <script src="vendor/pdf.min.js"></script>
  <script src="vendor/jszip.min.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
