<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BRAHM Office</title>
<link rel="stylesheet" href="styles.css">
<style>
  .pdfview{position:absolute;inset:0;display:none;overflow:auto;background:#444;-webkit-overflow-scrolling:touch}
  .pdfview canvas{display:block;margin:8px auto;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.4)}
  .textview{position:absolute;inset:0;display:none;overflow:auto;background:var(--bg);color:var(--txt);padding:14px;white-space:pre-wrap;font-size:14px;line-height:1.6}
  .htmlview{position:absolute;inset:0;display:none;border:0;width:100%;height:100%;background:#fff}
  .zoombar{display:none;align-items:center;gap:6px}
  .zoombar.show{display:flex}
  .loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--muted);font-size:15px;background:var(--bg)}
  .loading.show{display:flex}
  /* function autocomplete */
  .aclist{position:absolute;left:8px;right:8px;z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:8px;max-height:46vh;overflow:auto;display:none;box-shadow:0 6px 20px rgba(0,0,0,.5)}
  .aclist.show{display:block}
  .acitem{padding:10px 12px;border-bottom:1px solid var(--line);color:var(--txt);font-size:14px}
  .acitem .fn{color:var(--saffron);font-weight:600}
  .acitem .hint{color:var(--muted);font-size:12px;margin-left:6px}
  .acitem:active{background:#24324f}
  .fsep{display:inline-block;width:1px;height:20px;background:var(--line);margin:0 4px;vertical-align:middle}
  .fbtn.on{background:var(--saffron);color:#2a1d00}
  /* magnifier loupe */
  .loupe{position:fixed;width:150px;height:150px;border-radius:50%;border:3px solid var(--saffron);box-shadow:0 4px 18px rgba(0,0,0,.6);overflow:hidden;display:none;z-index:60;pointer-events:none;background:#fff}
  .loupe canvas{width:150px;height:150px}
  /* chart modal */
  .chartmodal{position:fixed;inset:0;z-index:70;background:rgba(14,24,48,.86);display:none;align-items:center;justify-content:center;padding:12px}
  .chartmodal.show{display:flex}
  .chartbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:100%;max-width:640px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
  .charthead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);color:var(--txt);font-weight:600}
  .chartbtns{display:flex;gap:6px;flex-wrap:wrap}
  .ctype.on{background:var(--saffron);color:#2a1d00}
  #chartcv{flex:1;width:100%;background:#fff;touch-action:none}
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="logo"></span> BRAHM Office</div>
    <button class="btn" id="btnOpen">Open</button>
    <button class="btn" id="btnNew">New</button>
    <button class="btn" id="btnUndo" title="Undo">↶ Undo</button>
    <button class="btn" id="btnFormat" title="Format">Aa</button>
    <button class="btn accent" id="btnSaveXlsx">Save .xlsx</button>
    <button class="btn" id="btnSaveCsv">.csv</button>
    <button class="btn" id="btnImages" style="display:none">Images</button>
    <div class="zoombar" id="zoombar">
      <button class="btn" id="zoomOut">−</button>
      <button class="btn" id="zoomIn">+</button>
    </div>
  </div>

  <div class="formulabar" id="fbar">
    <div class="cellref" id="cellref">A1</div>
    <input id="finput" placeholder="Value or =formula" spellcheck="false" autocomplete="off" autocapitalize="off">
  </div>
  <div class="aclist" id="aclist"></div>

  <div class="fmtbar" id="fmtbar">
    <button class="fbtn" id="fB" title="Bold"><b>B</b></button>
    <button class="fbtn" id="fI" title="Italic"><i>I</i></button>
    <label class="fbtn">A<input type="color" id="fColor" value="#16233f"></label>
    <label class="fbtn">Fill<input type="color" id="fFill" value="#fff59d"></label>
    <select id="fNF" class="fsel">
      <option value="gen">General</option>
      <option value="num">1,234.56</option>
      <option value="inr">₹ 1,234.56</option>
      <option value="pct">12.34%</option>
      <option value="date">Date</option>
    </select>
    <button class="fbtn" id="fClear">Clear</button>
    <button class="fbtn" id="fSortA">A→Z</button>
    <button class="fbtn" id="fSortZ">Z→A</button>
    <span class="fsep"></span>
    <button class="fbtn" id="fFreeze" title="Freeze first row & column">❄ Freeze</button>
    <button class="fbtn" id="fCopy" title="Copy cell">⧉ Copy</button>
    <button class="fbtn" id="fPaste" title="Paste cell">📋 Paste</button>
    <span class="fsep"></span>
    <button class="fbtn" id="fRowIns" title="Insert row above">+Row</button>
    <button class="fbtn" id="fRowDel" title="Delete this row">−Row</button>
    <button class="fbtn" id="fColIns" title="Insert column left">+Col</button>
    <button class="fbtn" id="fColDel" title="Delete this column">−Col</button>
    <span class="fsep"></span>
    <button class="fbtn" id="fChart" title="Chart from data">📊 Chart</button>
  </div>

  <div class="stage">
    <canvas id="grid"></canvas>
    <div class="pdfview" id="pdfview"></div>
    <div class="textview" id="textview"></div>
    <iframe class="htmlview" id="htmlview"></iframe>
    <div class="loading" id="loading">Opening…</div>
    <div class="gallery" id="gallery"></div>
    <div class="lightbox" id="lightbox"><img id="lightimg" src=""></div>
  </div>

  <div class="statusbar">
    <div class="sheettabs" id="tabs"></div>
    <div id="status">BRAHM Office · Developed by Sandeep Kushwah</div>
  </div>

  <div class="loupe" id="loupe"><canvas id="loupecv" width="150" height="150"></canvas></div>

  <div class="chartmodal" id="chartmodal">
    <div class="chartbox">
      <div class="charthead">
        <span id="charttitle">Chart</span>
        <div class="chartbtns">
          <button class="fbtn ctype on" data-ct="bar">Bar</button>
          <button class="fbtn ctype" data-ct="line">Line</button>
          <button class="fbtn ctype" data-ct="pie">Pie</button>
          <button class="fbtn" id="chartClose">✕</button>
        </div>
      </div>
      <canvas id="chartcv"></canvas>
    </div>
  </div>

  <script src="vendor/xlsx.full.min.js"></script>
  <script src="vendor/pdf.min.js"></script>
  <script src="vendor/jszip.min.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
