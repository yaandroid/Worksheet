name: Build BRAHM Office APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Rename APK
        run: |
          mkdir -p out
          cp $(find app/build/outputs/apk/release -name "*.apk" | head -1) out/BRAHM-Office-1.1.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BRAHM-Office-APK
          path: out/BRAHM-Office-1.1.apk
      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1-${{ github.run_number }}
          name: BRAHM Office 1.1 (build ${{ github.run_number }})
          files: out/BRAHM-Office-1.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
