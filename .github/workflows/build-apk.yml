name: Build APK
on:
  push: { branches: [ "brahm-autoeditor-apk" ] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect antonkarpenko ffmpeg-kit package
        run: |
          mkdir -p /tmp/out /tmp/a; P=/tmp/out/probe.txt; : > $P
          base="https://repo1.maven.org/maven2/com/antonkarpenko/ffmpeg-kit-full-gpl/2.2.3/ffmpeg-kit-full-gpl-2.2.3"
          echo "aar code: $(curl -s -o /tmp/a/x.aar -w '%{http_code}' -L "$base.aar")" >> $P
          cd /tmp/a && unzip -oq x.aar 2>/dev/null; ls -la >> $P
          unzip -oq classes.jar -d cj 2>/dev/null || true
          echo "== FFmpegKit class path ==" >> $P
          find cj -name "FFmpegKit.class" -o -name "FFmpegSession.class" -o -name "ReturnCode.class" 2>/dev/null | head >> $P
          echo "== top packages ==" >> $P
          find cj -name "*.class" 2>/dev/null | sed 's#cj/##;s#/[^/]*$##' | sort -u | grep -iE "ffmpeg|karpenko|arthenica" | head -20 >> $P
      - name: Publish probe
        if: always()
        run: |
          cd /tmp/out; git init -q; git checkout -b ci-output; git add -A
          git -c user.email=ci@brahm -c user.name=CI commit -q -m "probe5 pkg ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-output
