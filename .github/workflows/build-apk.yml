name: Build APK
on:
  push:
    branches: [ "**" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Collect APK
        run: |
          mkdir -p out
          cp "$(find app/build/outputs/apk/debug -name '*.apk' | head -1)" out/BRAHM-AutoEditor-1.1-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BRAHM-AutoEditor-debug-apk
          path: out/BRAHM-AutoEditor-1.1-debug.apk
