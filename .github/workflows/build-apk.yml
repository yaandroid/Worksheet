name: Build APK
on:
  push: { branches: [ "brahm-autoeditor-apk" ] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Discover maintained ffmpeg-kit AAR source
        run: |
          mkdir -p /tmp/out /tmp/w; P=/tmp/out/probe.txt; : > $P
          for pkg in ffmpeg_kit_flutter_new ffmpeg_kit_flutter; do
            echo "===== $pkg =====" >> $P
            url=$(curl -s "https://pub.dev/api/packages/$pkg" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['latest']['archive_url'])" 2>/dev/null)
            echo "archive: $url" >> $P
            [ -z "$url" ] && continue
            curl -sL "$url" -o /tmp/w/$pkg.tar.gz
            mkdir -p /tmp/w/$pkg && tar xzf /tmp/w/$pkg.tar.gz -C /tmp/w/$pkg 2>/dev/null
            echo "--- android/build.gradle ---" >> $P
            find /tmp/w/$pkg -path "*android*build.gradle*" -exec cat {} \; 2>/dev/null | grep -iE "maven|url|implementation|arthenica|aar|http" | head -30 >> $P
            echo "--- any .aar/.so bundled? ---" >> $P
            find /tmp/w/$pkg -iname "*.aar" -o -iname "*.so" 2>/dev/null | head >> $P
            echo "--- gradle/properties repos ---" >> $P
            grep -rniE "maven.*url|https?://[^ \"')]+" /tmp/w/$pkg/android 2>/dev/null | grep -iE "aar|maven|arthenica|github|storage|repo" | head -20 >> $P
          done
      - name: Publish probe
        if: always()
        run: |
          cd /tmp/out; git init -q; git checkout -b ci-output; git add -A
          git -c user.email=ci@brahm -c user.name=CI commit -q -m "probe4 ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-output
