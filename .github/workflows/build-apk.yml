name: Build APK
on:
  push:
    branches: [ "brahm-autoeditor-apk" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log || true
      - name: Publish output (apk + log) to ci-output branch
        if: always()
        run: |
          mkdir -p /tmp/out
          cp /tmp/build.log /tmp/out/build.log || true
          tail -c 60000 /tmp/build.log > /tmp/out/build.tail.log || true
          find app/build/outputs/apk/debug -name '*.apk' -exec cp {} /tmp/out/app-debug.apk \; || true
          cd /tmp/out
          git init -q
          git checkout -b ci-output
          git add -A
          git -c user.email=ci@brahm -c user.name=CI commit -q -m "ci output ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-output
